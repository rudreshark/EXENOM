name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main  # change if your default branch is different

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # If your project uses yarn: replace with `yarn` and `yarn build`
        # If your build output folder is different, update the path in the upload step below.

      - name: Upload build output for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist  # change to your build output dir, e.g., ./build or ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1